<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caparroso | Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; color: white; font-family: 'Inter', sans-serif;
            text-align: center; background: radial-gradient(circle, #0a0a0a, #000);
            overflow-x: hidden; position: relative;
        }

        .logo { 
            margin: 60px auto 20px; display: block; width: 80vw; max-width: 600px; 
            position: relative; cursor: default;
        }
        .logo img { width: 100%; display: block; }

        .play-btn {
            margin-top: 20px; padding: 12px 24px; font-size: 14px;
            background: transparent; border: 1px solid #00ffcc; color: #00ffcc;
            cursor: pointer; letter-spacing: 2px; transition: 0.3s; text-transform: uppercase;
            position: relative; z-index: 10;
        }
        .play-btn:hover { background: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; }

        .links { margin-top: 25px; position: relative; z-index: 10; }
        .links a { margin: 0 15px; font-size: 13px; color: white; text-decoration: none; opacity: 0.5; transition: 0.3s; }
        .links a:hover { opacity: 1; color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }

        /* GALERIA */
        .gallery { 
            margin-top: 80px; overflow: hidden; white-space: nowrap; 
            padding: 20px 0; border-top: 1px solid #222; position: relative; z-index: 10; 
        }
        .gallery-track { 
            display: inline-block; 
            animation: scrollGallery 40s linear infinite;
        }
        .gallery img { 
            height: 250px; margin-right: 25px; border-radius: 4px; 
            cursor: zoom-in; transition: 0.3s; vertical-align: middle;
        }
        .gallery img:hover { transform: scale(1.05); }
        
        @keyframes scrollGallery { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* MODAL */
        .img-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; align-items: center;
            justify-content: center; z-index: 2000; flex-direction: column;
        }
        .img-modal.active { display: flex; }
        .img-modal img { max-width: 90%; max-height: 75%; border: 1px solid #333; object-fit: contain; }
        
        .modal-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 40px; color: #00ffcc; cursor: pointer; user-select: none;
            padding: 20px; transition: 0.3s; z-index: 2100;
        }
        .modal-nav:hover { text-shadow: 0 0 15px #00ffcc; scale: 1.2; }
        .prev { left: 5%; }
        .next { right: 5%; }

        .modal-controls { margin-top: 20px; z-index: 2100; }
        .download-btn { background: #00ffcc; color: black; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 3px; margin-right: 15px; }
        .close-modal { color: white; cursor: pointer; opacity: 0.7; }

        /* JUEGO PANEL */
        .game-panel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .game-panel.active { display: flex; }
        canvas { border: 2px solid #ff0055; background: #000; box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
        .game-container { position: relative; }
        .score-top { position: absolute; top: -30px; left: 0; color: #ff0055; font-size: 14px; }
        .close-game { position: absolute; top: 30px; right: 40px; cursor: pointer; color: #ff0055; font-weight: bold; }
        
        /* MUSICA TAB */
        .music-tab {
            position: fixed; left: -320px; top: 50%; transform: translateY(-50%);
            width: 320px; background: rgba(10,10,10,0.98); border: 1px solid rgba(0,255,204,0.3);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; z-index: 999; text-align: left;
        }
        .music-tab:hover { left: 0; }
        .music-handle {
            position: absolute; right: -45px; top: 50%; transform: translateY(-50%);
            background: #0a0a0a; width: 45px; height: 55px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; color: #00ffcc; font-size: 20px; border: 1px solid rgba(0,255,204,0.3); border-left: none;
        }
        #trackName { color: #00ffcc; font-size: 14px; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .timeline { width: 100%; height: 4px; background: #222; cursor: pointer; margin: 10px 0; }
        .progress { height: 100%; width: 0%; background: #00ffcc; }
        .controls-music { display: flex; justify-content: space-between; margin: 15px 0; cursor: pointer; font-size: 12px; }
        #trackList { max-height: 180px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="logo">
        <img src="Imagenes/Caparroso PNG .png" alt="Caparroso Logo">
    </div>

    <button class="play-btn" onclick="openGame()">JUEGA Y ESCUCHA</button>

    <div class="links">
        <a href="#" target="_blank">SPOTIFY</a>
        <a href="https://www.instagram.com/caparrosoo/" target="_blank">INSTAGRAM</a>
        <a href="https://www.youtube.com/@Caparrosoofc" target="_blank">YOUTUBE</a>
        <a href="https://x.com/RodCaparroso" target="_blank">X</a>
    </div>

    <div class="gallery">
        <div class="gallery-track" id="galleryTrack"></div>
    </div>

    <div class="img-modal" id="imgModal">
        <span class="modal-nav prev" onclick="changeImg(-1)">❮</span>
        <img src="" id="modalImg">
        <span class="modal-nav next" onclick="changeImg(1)">❯</span>
        <div class="modal-controls">
            <a href="" id="downloadBtn" download class="download-btn">DESCARGAR GRATIS</a>
            <span class="close-modal" onclick="closeImg()">CERRAR</span>
        </div>
    </div>

    <div class="game-panel" id="gamePanel">
        <div class="close-game" onclick="closeGame()">CERRAR [X]</div>
        <div class="game-container">
            <div class="score-top">Score: <span id="score">0</span></div>
            <canvas id="game" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="music-tab">
        <div class="music-handle">♫</div>
        <div id="trackName">Cargando...</div>
        <div class="timeline" onclick="seek(event)"><div class="progress" id="p-bar"></div></div>
        <div class="controls-music">
            <span onclick="prevTrack()">◀◀</span>
            <span onclick="togglePlay()" id="btnP">PLAY</span>
            <span onclick="nextTrack()">▶▶</span>
        </div>
        <div id="trackList"></div>
    </div>

    <audio id="player"></audio>

<script>
    // --- RUTAS DE IMÁGENES CORREGIDAS SEGÚN TUS CARPETAS ---
    const uniqueImages = [
        "Imagenes/3DSyka.png",
        "Imagenes/BACKGROUND.png",
        "Imagenes/FIRST&ORIGINAL.jpg",
        "Imagenes/SYKA CHOKIS.png",
        "Imagenes/SYKA LOGO BLUE.jpg",
        "Imagenes/SYKA LOGO.jpg",
        "Imagenes/SYKABLUEWALLPAPER.jpeg",
        "Imagenes/SYKAPROMO.jpg"
    ];

    const track = document.getElementById('galleryTrack');
    const allImgs = [...uniqueImages, ...uniqueImages]; 
    allImgs.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.onclick = () => openImg(src);
        track.appendChild(img);
    });

    let currentImgIdx = 0;
    function openImg(src) {
        const fileName = src.split('/').pop();
        currentImgIdx = uniqueImages.findIndex(i => i.includes(fileName));
        updateModal();
        document.getElementById('imgModal').classList.add('active');
    }
    function closeImg() { document.getElementById('imgModal').classList.remove('active'); }
    function changeImg(step) {
        currentImgIdx = (currentImgIdx + step + uniqueImages.length) % uniqueImages.length;
        updateModal();
    }
    function updateModal() {
        const newSrc = uniqueImages[currentImgIdx];
        document.getElementById('modalImg').src = newSrc;
        document.getElementById('downloadBtn').href = newSrc;
    }

    // --- REPRODUCTOR ---
    const tracks = ["MUSICA/A_new_hope.wav","MUSICA/Miku(club Version)(Caparroso).wav","MUSICA/Over_Again.wav","MUSICA/Santuario.wav","MUSICA/Syka.wav","MUSICA/TechniColor.wav","MUSICA/Up(Caparroso).wav","MUSICA/Warlock.wav"];
    let cur = 0; const p = document.getElementById("player");
    function load(i){ 
        cur=i; p.src=tracks[i]; 
        document.getElementById("trackName").innerText=tracks[i].split("/").pop().replace(".wav",""); 
    }
    function togglePlay(){ if(p.paused){ p.play(); btnP.innerText="PAUSE"; } else { p.pause(); btnP.innerText="PLAY"; }}
    function nextTrack(){ cur=(cur+1)%tracks.length; load(cur); p.play(); btnP.innerText="PAUSE"; }
    function prevTrack(){ cur=(cur-1+tracks.length)%tracks.length; load(cur); p.play(); btnP.innerText="PAUSE"; }
    load(0);

    // --- JUEGO (LÓGICA SIMPLIFICADA) ---
    function openGame() { document.getElementById('gamePanel').classList.add('active'); }
    function closeGame() { document.getElementById('gamePanel').classList.remove('active'); }

</script>
</body>
</html>
