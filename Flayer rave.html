<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Caparroso Rave</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  /* 🔥 FONDO */
  .bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("Images Hyperpop/hyperpopback.jpg") no-repeat center center;
    background-size: cover;
    z-index: -2;
  }

  /* 🔥 GLITCH CAPAS (SIN FLICKER) */
  .bg::before,
  .bg::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: inherit;
    opacity: 0.6;
    mix-blend-mode: screen;
  }

  /* RGB SPLIT */
  .bg::before {
    animation: glitchRGB 2s infinite linear;
  }

  .bg::after {
    animation: glitchRGB2 1.5s infinite linear;
  }

  /* 🔥 LÍNEAS GLITCH */
  .scanlines {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(255,255,255,0.05) 3px
    );
    animation: scanMove 0.2s infinite linear;
  }

  @keyframes glitchRGB {
    0% { transform: translate(0); }
    20% { transform: translate(-5px,2px); filter: hue-rotate(90deg); }
    40% { transform: translate(5px,-2px); filter: hue-rotate(180deg); }
    60% { transform: translate(-3px,1px); }
    80% { transform: translate(3px,-1px); }
    100% { transform: translate(0); }
  }

  @keyframes glitchRGB2 {
    0% { transform: translate(0); }
    25% { transform: translate(3px,-3px); }
    50% { transform: translate(-3px,3px); }
    75% { transform: translate(2px,-2px); }
    100% { transform: translate(0); }
  }

  @keyframes scanMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  canvas {
    display: block;
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="scanlines"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
<script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 10;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// luces
const light = new THREE.PointLight(0xffffff, 5);
light.position.set(5,5,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambient);

// texto
const loader = new THREE.FontLoader();

loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(font){

  function crearTexto(texto, y){
    const geo = new THREE.TextGeometry(texto, {
      font: font,
      size: 1,
      height: 0.5
    });

    geo.center();

    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveIntensity: 0.6
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = y;

    scene.add(mesh);
    return mesh;
  }

  const t1 = crearTexto("CAPARROSO", 2);
  const t2 = crearTexto("FRED AGAIN", 0);
  const t3 = crearTexto("SKRILLEX", -2);

  function animate(){
    requestAnimationFrame(animate);

    const time = Date.now()*0.001;

    [t1,t2,t3].forEach((t,i)=>{
      t.rotation.y += 0.01;

      // 🌈 COLOR LOOP
      const hue = (time*0.15 + i*0.3) % 1;
      t.material.color.setHSL(hue, 1, 0.5);
      t.material.emissive.setHSL(hue, 1, 0.5);
    });

    renderer.render(scene, camera);
  }

  animate();
});
</script>

</body>
</html>
