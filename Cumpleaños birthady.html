<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caparroso Birthday</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --eb-blue-dark: #1010A0;
            --eb-blue-light: #6080FF;
            --eb-text-white: #FFFFFF;
            --eb-text-yellow: #FFFF00;
            --eb-pink-psi: #FF00FF;
            --main-font: 'VT323', monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Degradado fucsia a negro basado en tu previa captura */
            background: radial-gradient(circle, rgba(160,0,160,1) 0%, rgba(0,0,0,1) 100%);
            font-family: var(--main-font);
            color: var(--eb-text-white);
            text-rendering: pixelated;
        }

        .invitation-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            perspective: 1000px;
        }

        .title-3d {
            font-size: 3.5rem;
            color: var(--eb-text-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #A00000, -1px -1px 0px #000;
            margin-bottom: 50px;
            animation: rotate3D 5s infinite linear;
            display: inline-block;
            transform-style: preserve-3d;
        }

        @keyframes rotate3D {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .dialog-box {
            background-color: var(--eb-blue-dark);
            border: 4px solid var(--eb-blue-light);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 5px 5px 0px #000;
            position: relative;
        }

        .dialog-box::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; bottom: 2px; right: 2px;
            border: 2px solid var(--eb-blue-light);
            pointer-events: none;
        }

        h2 { font-size: 2.2rem; margin: 0 0 15px 0; color: var(--eb-text-yellow); }
        p { font-size: 1.8rem; margin: 8px 0; line-height: 1.2; }
        .highlight { color: #00FF00; }

        .btn-teleport {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background-color: #A000A0;
            color: var(--eb-text-white);
            border: 4px solid var(--eb-pink-psi);
            font-size: 1.6rem;
            text-decoration: none;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }

        .btn-teleport:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px #000;
        }

        .cursor {
            display: inline-block;
            width: 15px;
            height: 15px;
            background: #FF4040;
            margin-left: 5px;
            animation: blink 0.6s infinite step-end;
            vertical-align: middle;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="invitation-container">
        <h1 class="title-3d">Caparroso Birthday</h1>

        <div class="dialog-box">
            <h2>¡Evento Nivel 25!</h2>
            <p>¡Te invito a celebrar mi cumpleaños!</p>
            <p><span class="highlight">HORA:</span> 6:00 PM</p>
            <p><span class="highlight">LUGAR:</span> Latitud La Victoria, Qro.</p>
            <p>¡No faltes!<span class="cursor"></span></p>
            
            <a href="https://www.google.com/maps/search/?api=1&query=Latitud+La+Victoria+Queretaro" target="_blank" class="btn-teleport">
                PSI TELEPORT (MAPS)
            </a>
        </div>
    </div>
</body>
</html>
