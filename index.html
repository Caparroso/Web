<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caparroso | Oficial</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            color: white;
            font-family: 'Inter', sans-serif;
            text-align: center;
            background: radial-gradient(circle, #0a0a0a, #000);
            overflow-x: hidden;
            position: relative;
        }

        .logo {
            margin: 60px auto 20px;
            display: block;
            width: 80vw;
            max-width: 600px;
            position: relative;
            cursor: default;
        }

        .logo img {
            width: 100%;
            display: block;
        }

        .play-btn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 14px;
            background: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
        }

        .play-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }

        .links {
            margin-top: 25px;
            position: relative;
            z-index: 10;
        }

        .links a {
            margin: 0 15px;
            font-size: 13px;
            color: white;
            text-decoration: none;
            opacity: 0.5;
            transition: 0.3s;
        }

        .links a:hover {
            opacity: 1;
            color: #00ffcc;
            text-shadow: 0 0 8px #00ffcc;
        }

        /* GALERIA */
        .gallery {
            margin-top: 80px;
            overflow: hidden;
            white-space: nowrap;
            padding: 20px 0;
            border-top: 1px solid #222;
            position: relative;
            z-index: 10;
        }

        .gallery-track {
            display: inline-block;
            animation: scrollGallery 40s linear infinite;
        }

        .gallery img {
            height: 250px;
            margin-right: 25px;
            border-radius: 4px;
            cursor: zoom-in;
            transition: 0.3s;
            vertical-align: middle;
            pointer-events: auto;
        }

        .gallery img:hover {
            transform: scale(1.05);
            z-index: 50;
            position: relative;
        }

        @keyframes scrollGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* MODAL IMAGENES */
        .img-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            flex-direction: column;
        }

        .img-modal.active {
            display: flex;
        }

        .img-modal img {
            max-width: 90%;
            max-height: 75%;
            border: 1px solid #333;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: #00ffcc;
            cursor: pointer;
            user-select: none;
            padding: 20px;
            z-index: 2100;
        }

        .prev { left: 5%; }
        .next { right: 5%; }

        .modal-controls {
            margin-top: 20px;
            z-index: 2100;
        }

        .download-btn {
            background: #00ffcc;
            color: black;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 3px;
            margin-right: 15px;
        }

        .close-modal {
            color: white;
            cursor: pointer;
            opacity: 0.7;
        }

        /* JUEGO */
        .game-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .game-panel.active {
            display: flex;
        }

        canvas {
            border: 2px solid #ff0055;
            background: #000;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
        }

        .game-container {
            position: relative;
        }

        .score-top {
            position: absolute;
            top: -30px;
            left: 0;
            color: #ff0055;
            font-size: 14px;
        }

        .close-game {
            position: absolute;
            top: 30px;
            right: 40px;
            cursor: pointer;
            color: #ff0055;
            font-weight: bold;
        }

        .controls-game {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }

        .controls-game span {
            margin: 0 15px;
            cursor: pointer;
            border: 1px solid white;
            padding: 5px 10px;
            transition: 0.2s;
        }

        .controls-game span:hover {
            background: white;
            color: black;
        }

        .scoreboard {
            position: absolute;
            right: -180px;
            top: 0;
            width: 150px;
            text-align: left;
            font-size: 12px;
            color: #00ffcc;
            opacity: 0.8;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .game-over.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-over input {
            background: none;
            border: none;
            border-bottom: 2px solid #00ffcc;
            color: white;
            text-align: center;
            padding: 10px;
            outline: none;
            margin-top: 10px;
            font-family: 'Inter';
        }

        /* REPRODUCTOR */
        .music-tab {
            position: fixed;
            left: -320px;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            background: rgba(10,10,10,0.98);
            border: 1px solid rgba(0,255,204,0.3);
            transition: 0.5s;
            padding: 20px;
            z-index: 999;
            text-align: left;
        }

        .music-tab:hover {
            left: 0;
        }

        .music-handle {
            position: absolute;
            right: -45px;
            top: 50%;
            transform: translateY(-50%);
            background: #0a0a0a;
            width: 45px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #00ffcc;
            border: 1px solid rgba(0,255,204,0.3);
            border-left: none;
        }

        #trackName {
            color: #00ffcc;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .timeline {
            width: 100%;
            height: 4px;
            background: #222;
            cursor: pointer;
            margin: 10px 0;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #00ffcc;
        }

        .controls-music {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            cursor: pointer;
            font-size: 12px;
        }

        #trackList {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
            font-size: 11px;
        }

        #trackList div {
            padding: 5px 0;
            opacity: 0.5;
            border-bottom: 1px solid #111;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="logo">
        <img src="Imagenes/Caparroso PNG .png" alt="Caparroso Logo">
    </div>

    <button class="play-btn" onclick="openGame()">JUEGA Y ESCUCHA</button>

    <div class="links">
        <a href="https://open.spotify.com/intl-es/artist/5Xg7hRgbAdmx6v8t21M4Sw" target="_blank">SPOTIFY</a>
        <a href="https://www.instagram.com/caparrosoo/" target="_blank">INSTAGRAM</a>
        <a href="https://www.youtube.com/@Caparrosoofc" target="_blank">YOUTUBE</a>
        <a href="https://x.com/RodCaparroso" target="_blank">X</a>
    </div>

    <div class="gallery">
        <div class="gallery-track">
            <img src="Imagenes/3DSyka.png" onclick="openImg(this.src)">
            <img src="Imagenes/BACKGROUND.png" onclick="openImg(this.src)">
            <img src="Imagenes/FIRST&ORIGINAL.jpeg" onclick="openImg(this.src)">
            <img src="Imagenes/SYKA LOGO BLUE.jpeg" onclick="openImg(this.src)">
            <img src="Imagenes/SYKA LOGO.png" onclick="openImg(this.src)">
            <img src="Imagenes/SYKABLUEWALLPAPER.jpeg" onclick="openImg(this.src)">
            <img src="Imagenes/SYKAPROMO.png" onclick="openImg(this.src)">
        </div>
    </div>

    <div class="img-modal" id="imgModal">
        <span class="modal-nav prev" onclick="changeImg(-1)">❮</span>
        <img src="" id="modalImg">
        <span class="modal-nav next" onclick="changeImg(1)">❯</span>

        <div class="modal-controls">
            <a href="" id="downloadBtn" download class="download-btn">
                DESCARGAR GRATIS
            </a>

            <span class="close-modal" onclick="closeImg()">
                CERRAR
            </span>
        </div>
    </div>

    <div class="game-panel" id="gamePanel">

        <div class="close-game" onclick="closeGame()">
            CERRAR [X]
        </div>

        <div class="game-container">

            <div class="score-top">
                Score: <span id="score">0</span>
            </div>

            <canvas id="game" width="400" height="400"></canvas>

            <div class="controls-game">
                <span onclick="startGame()">PLAY</span>
                <span onclick="pauseGame()">PAUSE</span>
                <span onclick="resetGame()">RESET</span>
            </div>

            <div class="scoreboard" id="leaderboard">
                <p style="border-bottom:1px solid #00ffcc">
                    GLOBAL TOP
                </p>
            </div>

            <div class="game-over" id="gameOverBlock">
                <h2 style="color:#ff0055">GAME OVER</h2>

                <p>
                    SCORE: <span id="finalScore">0</span>
                </p>

                <input
                    id="nameInput"
                    placeholder="Tu nombre + Enter"
                    autocomplete="off"
                >
            </div>
        </div>
    </div>

    <div class="music-tab">

        <div class="music-handle">♫</div>

        <div id="trackName">Cargando...</div>

        <div class="timeline" onclick="seek(event)">
            <div class="progress" id="p-bar"></div>
        </div>

        <div class="controls-music">
            <span onclick="prevTrack()">◀◀</span>
            <span onclick="togglePlay()" id="btnP">PLAY</span>
            <span onclick="nextTrack()">▶▶</span>
        </div>

        <div id="trackList"></div>
    </div>

    <audio id="player"></audio>

<script>

    // --- IMAGENES ---
    let currentImgIdx = 0;

    const uniqueImages = [
        "Imagenes/3DSyka.png",
        "Imagenes/BACKGROUND.png",
        "Imagenes/FIRST&ORIGINAL.jpeg",
        "Imagenes/SYKA LOGO BLUE.jpeg",
        "Imagenes/SYKA LOGO.png",
        "Imagenes/SYKABLUEWALLPAPER.jpeg",
        "Imagenes/SYKAPROMO.png"
    ];

    function openImg(src) {
        const fileName = src.split('/').pop();

        currentImgIdx = uniqueImages.findIndex(
            img => img.includes(fileName)
        );

        updateModal();

        document.getElementById('imgModal')
            .classList.add('active');
    }

    function closeImg() {
        document.getElementById('imgModal')
            .classList.remove('active');
    }

    function changeImg(step) {
        currentImgIdx =
            (currentImgIdx + step + uniqueImages.length)
            % uniqueImages.length;

        updateModal();
    }

    function updateModal() {
        document.getElementById('modalImg').src =
            uniqueImages[currentImgIdx];

        document.getElementById('downloadBtn').href =
            uniqueImages[currentImgIdx];
    }

    // --- REPRODUCTOR ---
    const tracks = [
        "MUSICA/All I See (Master).wav",
        "MUSICA/Bacha.wav",
        "MUSICA/Brain Stars.wav",
        "MUSICA/Determination of life.wav",
        "MUSICA/Feel's.wav",
        "MUSICA/Im not runnin Im just let it go (Master).wav",
        "MUSICA/Loft.wav",
        "MUSICA/Monster.wav",
        "MUSICA/Never going like we want.wav",
        "MUSICA/Nights Out.wav",
        "MUSICA/Santuario.wav",
        "MUSICA/Sorrows(Master).wav",
        "MUSICA/Syka.wav",
        "MUSICA/Termina.wav"
    ];

    let cur = 0;

    const p = document.getElementById("player");

    function load(i){
        cur=i;
        p.src=tracks[i];

        document.getElementById("trackName").innerText =
            tracks[i]
            .split("/")
            .pop()
            .replace(".wav","");
    }

    function togglePlay(){
        if(p.paused){
            p.play();
            btnP.innerText="PAUSE";
        } else {
            p.pause();
            btnP.innerText="PLAY";
        }
    }

    function nextTrack(){
        cur=(cur+1)%tracks.length;
        load(cur);
        p.play();
        btnP.innerText="PAUSE";
    }

    function prevTrack(){
        cur=(cur-1+tracks.length)%tracks.length;
        load(cur);
        p.play();
        btnP.innerText="PAUSE";
    }

    p.ontimeupdate = () => {
        if(p.duration){
            document.getElementById("p-bar").style.width =
                (p.currentTime/p.duration)*100+"%";
        }
    };

    function seek(e){
        const r=e.currentTarget.getBoundingClientRect();

        p.currentTime =
            ((e.clientX-r.left)/r.width)*p.duration;
    }

    tracks.forEach((t,i)=>{

        let d=document.createElement("div");

        d.innerText =
            (i+1)+". "+
            t.split("/").pop().replace(".wav","");

        d.onclick=()=>{
            load(i);
            p.play();
            btnP.innerText="PAUSE";
        };

        document.getElementById("trackList")
            .appendChild(d);
    });

    load(0);

    // --- JUEGO SNAKE ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const grid = 20;
    const tiles = 20;

    let snake;
    let vel;
    let food;
    let score;
    let running = false;
    let gameInterval;

    let globalScores =
        JSON.parse(
            localStorage.getItem('caparroso_ranks')
        ) || [];

    function init() {

        snake = [{x:10, y:10}];

        vel = {x:0, y:0};

        score = 0;

        food = {
            x:Math.floor(Math.random()*tiles),
            y:Math.floor(Math.random()*tiles)
        };

        document.getElementById('score').innerText =
            score;

        renderLeaderboard();
    }

    function openGame() {
        document.getElementById('gamePanel')
            .classList.add('active');

        init();

        draw();
    }

    function closeGame() {
        document.getElementById('gamePanel')
            .classList.remove('active');

        pauseGame();
    }

    function startGame() {

        if(!running){

            running = true;

            if(vel.x === 0 && vel.y === 0){
                vel = {x:1, y:0};
            }

            gameInterval =
                setInterval(gameLoop, 110);
        }
    }

    function pauseGame(){
        running = false;
        clearInterval(gameInterval);
    }

    function resetGame(){

        pauseGame();

        document.getElementById('gameOverBlock')
            .classList.remove('active');

        init();

        draw();
    }

    function gameLoop(){
        update();
        draw();
    }

    function update(){

        let head = {
            x: snake[0].x + vel.x,
            y: snake[0].y + vel.y
        };

        if(
            head.x<0 ||
            head.x>=tiles ||
            head.y<0 ||
            head.y>=tiles ||
            snake.some(
                s => s.x===head.x && s.y===head.y
            )
        ){
            gameOver();
            return;
        }

        snake.unshift(head);

        if(head.x === food.x && head.y === food.y){

            score++;

            document.getElementById('score')
                .innerText = score;

            food = {
                x: Math.floor(Math.random()*tiles),
                y: Math.floor(Math.random()*tiles)
            };

        } else {
            snake.pop();
        }
    }

    function draw(){

        ctx.fillStyle = "black";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "#ff0055";

        ctx.fillRect(
            food.x * grid,
            food.y * grid,
            grid - 2,
            grid - 2
        );

        ctx.fillStyle = "#00ffcc";

        snake.forEach(s =>

            ctx.fillRect(
                s.x * grid,
                s.y * grid,
                grid - 2,
                grid - 2
            )
        );
    }

    function gameOver(){

        pauseGame();

        document.getElementById('finalScore')
            .innerText = score;

        const block =
            document.getElementById('gameOverBlock');

        block.classList.add('active');

        document.getElementById('nameInput')
            .focus();
    }

    // --- SCOREBOARD ---
    document.getElementById('nameInput')
        .addEventListener('keydown', function(e){

        if(e.key === 'Enter' &&
           this.value.trim() !== ""){

            const newEntry = {
                name: this.value.trim(),
                points: score
            };

            globalScores.push(newEntry);

            globalScores.sort(
                (a, b) => b.points - a.points
            );

            globalScores =
                globalScores.slice(0, 5);

            localStorage.setItem(
                'caparroso_ranks',
                JSON.stringify(globalScores)
            );

            this.value = "";

            resetGame();
        }
    });

    function renderLeaderboard(){

        const lb =
            document.getElementById('leaderboard');

        lb.innerHTML =
            '<p style="border-bottom:1px solid #00ffcc">GLOBAL TOP</p>';

        globalScores.forEach((s, i) => {

            lb.innerHTML +=
                `<p>#${i+1} ${s.name}: ${s.points}</p>`;
        });
    }

    window.addEventListener('keydown', e => {

        if(
            !document.getElementById('gamePanel')
            .classList.contains('active')
        ) return;

        if(document.activeElement.id === 'nameInput')
            return;

        if(e.key==='ArrowUp' && vel.y!==1)
            vel={x:0,y:-1};

        if(e.key==='ArrowDown' && vel.y!==-1)
            vel={x:0,y:1};

        if(e.key==='ArrowLeft' && vel.x!==1)
            vel={x:-1,y:0};

        if(e.key==='ArrowRight' && vel.x!==-1)
            vel={x:1,y:0};

        if([
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ].includes(e.key)){
            e.preventDefault();
        }
    });

</script>

</body>
</html>
